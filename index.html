<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择下载版本</title>
    <style>
        body{font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0d1117;color:#e6edf3}
        .box{text-align:center;max-width:320px;padding:24px}
        h1{font-size:1.2rem;margin:0 0 6px}
        p{color:#8b949e;font-size:.85rem;margin:0}
        .btns{display:flex;flex-direction:column;gap:12px;margin-top:22px}
        a.btn{display:block;padding:14px;border-radius:10px;background:#238636;color:#fff;text-decoration:none;font-weight:600}
        a.btn.alt{background:#21262d;border:1px solid #30363d}
    </style>
</head>
<body>
    <div class="box">
        <h1 id="msg">请选择下载版本</h1>
        <p>点击按钮即开始下载</p>
        <div class="btns">
            <a class="btn" id="btn-5" href="#">下载 5.apks（GP）</a>
            <a class="btn alt" id="btn-3" href="#">下载 3.apks（NAVI）</a>
        </div>
    </div>
    <script>
        const BASE = "https://github.com/jhfdxvbjjgddcbb/jhfdxvbjjgddcbb.github.io/releases/download/";
        const VERSIONS = { "3": "3.apks", "5": "5.apks" };

        const url = v => BASE + v + "/" + VERSIONS[v];
        const v = new URLSearchParams(location.search).get("v");

        document.getElementById("btn-5").href = url("5");
        document.getElementById("btn-3").href = url("3");

        // 带 ?v=3 / ?v=5 参数才自动下载；不带参数只显示选择页
        if (VERSIONS[v]) {
            document.getElementById("msg").textContent = "Downloading " + VERSIONS[v] + "...";
            window.location.href = url(v);
        }
    </script>
</body>
</html>
